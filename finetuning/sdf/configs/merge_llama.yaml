condition: Merge the 50k SDF LoRA into Llama-3.1-8B-Instruct base weights

description: >
  Folds the stage-1 SDF LoRA into the base weights, producing a standalone
  per-persona checkpoint. Consumed directly by the LIMA-augmented SFT condition;
  the seed and expanded conditions merge in-process instead.

job:
  personas: [goodness, misaligned, sarcasm]

model:
  base: /projects/u6ez/britt/models/llama-3.1-8b-it
  lora_base: /projects/u6ez/britt/loras/exp1/llama-sdf-50k

output:
  save_dir: /projects/u6ez/britt/models/llama-3.1-8b-it-sdf
